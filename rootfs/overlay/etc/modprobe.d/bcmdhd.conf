# hub-11 Wi-Fi: mainline brcmfmac (client only) until the vendor bcmdhd port boots the radio
# (docs/wlan1-ap.md). To try bcmdhd: blacklist brcmfmac + brcmfmac_wcc instead and reboot.
# Never `modprobe -r bcmdhd` on a live system: its teardown path crashed the kernel (2026-09-06).
blacklist bcmdhd
options bcmdhd firmware_path=/lib/firmware/brcm/fw_bcm43752a2_pcie_ag.bin nvram_path=/lib/firmware/brcm/nvram_ap6275p.txt
